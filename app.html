        ({ GoogleAuthProvider , signInWithPopup} = U)
        await auth.authStateReady();
      } catch (e) {
        db = null; // could not load Firebase: stay in demo mode (this device only)
      }
    }
    
    const VIEWS = ["roleView","studentForm","teacherForm","homeView","sectionView","doneView"];
    const show = id => {
      VIEWS.forEach(v => $(v).classList.add("hide")); $(id).classList.remove("hide");
      $("menuBtn").classList.toggle("hide", !(id === "homeView" || id === "sectionView"));
      closeMenu(); window.scrollTo(0, 0);
    };
    const fill = (el, list) => el.innerHTML = list.map(x => `<option>${x}</option>`).join("");
    const upErr = m => { const e = $("upMsg"); e.textContent = m || ""; e.classList.toggle("hide", !m); };
    const err = m => { $("msg").textContent = m || ""; if (m) window.scrollTo(0, 0); };
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    
    [$("sYear"), $("pYear")].forEach(e => fill(e, YEARS));
    [$("sBranch"), $("pBranch")].forEach(e => fill(e, BRANCHES));
    $("sDiv").innerHTML = DIVISIONS.map(d => `<option value="${d}">Batch ${d}</option>`).join("");
    $("pDivs").innerHTML = DIVISIONS.map(d => `<label><input type="checkbox" value="${d}">${d}</label>`).join("");
    
    // Student details are saved on this phone/browser. Teachers must log in.
    let me = JSON.parse(localStorage.getItem("fcritUser") || "null");
    let unsub = null, current = null;
    
    function start() {
      err("");
      // teacher saved on device but no longer logged in to Firebase: ask to log in again
      // if (me && me.rol e === "teacher" && db && !auth.currentUser) { me = null; localStorage.removeItem("fcritUser"); }
      if (!me) return show("roleView");
      fillDrawer();
      $("hi").innerHTML = "Hi, " + esc((me.name || "").trim().split(" ")[0]) + "<small>Ready to learn something new today?</small>";
      $("tiles").innerHTML = SECTIONS.map(s => `<div class="tile" data-id="${s.id}"><div class="ic" style="background:${s.bg};color:${s.c}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${s.svg}</svg></div>${s.name}</div>`).join("");
      show("homeView");
      watchNew();}
    let unsubNew = null;
function watchNew() {
  if (unsubNew) unsubNew();
  if (!db || me.role !== "student") return;
  if (!localStorage.getItem("fcritFirst")) localStorage.setItem("fcritFirst", Date.now());
  const q = query(collection(db,"posts"), where("targets","array-contains",`${me.year}_${me.branch}_${me.div}`));
  unsubNew = onSnapshot(q, snap => {
    const counts = {};
    snap.docs.forEach(d => {
      const p = d.data(), t = (p.createdAt?.seconds || 0) * 1000;
      const last = Number(localStorage.getItem("fcritSeen_" + p.section) || localStorage.getItem("fcritFirst"));
      if (t > last) counts[p.section] = (counts[p.section] || 0) + 1;
    });
    document.querySelectorAll(".tile").forEach(el => {
      el.querySelector(".nb")?.remove();
      const n = counts[el.dataset.id];
      if (n) el.insertAdjacentHTML("beforeend", `<span class="nb">${n}</span>`);
    });
  });
}
    
    // ---- side menu (three-line icon) ----
    function openMenu() { $("drawer").classList.add("open"); $("scrim").classList.add("open"); $("drawer").setAttribute("aria-hidden","false"); }
    function closeMenu() { $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); $("drawer").setAttribute("aria-hidden","true"); }
    function fillDrawer() {
      const rows = me.role === "student"
        ? [["Name", me.name], ["Roll number", me.roll], ["Year", me.year], ["Branch", me.branch], ["Batch", me.div]]
        : [["Name", me.name], ["Subject", me.subject], ["Email", me.email]];
      $("dAvatar").textContent = (me.name || "?").trim().charAt(0).toUpperCase();
      $("dName").textContent = me.name;
      $("dRole").textContent = me.role === "student" ? "Student" : "Teacher";
      $("dRows").innerHTML = rows.filter(r => r[1]).map(r => `<div class="dRow"><small>${r[0]}</small><span>${esc(r[1])}</span></div>`).join("");
    }
    $("menuBtn").onclick = openMenu;
    $("scrim").onclick = closeMenu;
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
    
    $("tiles").onclick = e => {
      const t = e.target.closest(".tile"); if (!t) return;
      if (t.dataset.id === "reminders") return void openReminders();
      if (t.dataset.id === "website") return void window.open(WEBSITE_URL, "_blank", "noopener");
      openSection(t.dataset.id);
    };
    $("resetBtn").onclick = async () => {
      localStorage.removeItem("fcritUser"); me = null;
      if (auth && signOutFn) try { await signOutFn(auth); } catch (e) {}
      start();
    };
    
    // ---- role + basic info ----
    $("roleStudent").onclick = () => show("studentForm");
    $("roleTeacher").onclick = () => show("teacherForm");
    
    $("saveStudent").onclick = () => {
      if (!$("sName").value.trim() || !$("sRoll").value.trim()) return err("Enter your name and roll number.");
      me = { role:"student", name:$("sName").value.trim(), roll:$("sRoll").value.trim(), year:$("sYear").value, branch:$("sBranch").value, div:$("sDiv").value };
      localStorage.setItem("fcritUser", JSON.stringify(me));
      start();
    };
    
    
      $("saveTeacher").onclick = async () => {
  const name = $("tName").value.trim(), subject = $("tSubject").value.trim();
  if (!name || !subject) return err("Enter your name and subject.");
  try {
    const U = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
    const r = await U.signInWithPopup(auth, new U.GoogleAuthProvider());

    // const r = await signInWithPopup(auth, new GoogleAuthProvider());
    const email = r.user.email.toLowerCase();
    // 
    if (!TEACHERS.includes(email)) { await signOutFn(auth); return err("This account is not authorized."); }
    me = { role:"teacher", name,  subject, uid:r.user.uid, email };
    localStorage.setItem("fcritUser", JSON.stringify(me));
    start();
  } catch (e) { err(e.message); }
};


    // ---- sections ----
    function openSection(id) {
      current = SECTIONS.find(s => s.id === id);
      if (me.role === "student") localStorage.setItem("fcritSeen_" + id, Date.now());
      $("secTitle").textContent = current.name;
      $("postForm").classList.toggle("hide", me.role !== "teacher");
      if (me.role === "teacher") configureForm();
      show("sectionView");
      if (unsub) unsub();
      if (!db) return showLocal();
      // students: only their class. teachers: only their own posts in this section.
      const q = me.role === "student"
        ? query(collection(db,"posts"), where("section","==",id), where("targets","array-contains",`${me.year}_${me.branch}_${me.div}`))
        : query(collection(db,"posts"), where("section","==",id), where("authorUid","==",me.uid));
      unsub = onSnapshot(q, snap => {
        const items = builtIn(id).concat(snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0)));
        $("list").innerHTML = items.map(card).join("") || "<p>Nothing here yet.</p>";
      }, e => err(e.message));
    }
    
    function configureForm() {
      const c = FORM[current.id];
      $("postForm").querySelector("b").textContent = "Add to " + current.name;
      $("pTitle").placeholder = c.title + " (optional)";
      $("pMsg").classList.toggle("hide", !c.msg);
      if (c.msg) $("pMsg").placeholder = c.msg + " (optional)";
      $("pLink").classList.toggle("hide", !c.link);
      if (c.link) $("pLink").placeholder = c.link + " (optional)";
      $("pTitle").value = $("pMsg").value = $("pLink").value = "";
      $("pTitle").classList.toggle("hide", !!c.contact);
      $("pPhone").classList.toggle("hide", !c.contact); $("pPhone").value = "";
      $("fPdf").classList.toggle("hide", !!c.contact);
      if (c.contact) $("pMsg").placeholder = c.msg;
      $("fPhoto").classList.toggle("hide", !c.photo);
      $("fDate").classList.toggle("hide", !c.date);
      setDateOn(false); setPhoto(null); setPdf(null);
      $("pYear").innerHTML = (c.all ? '<option value="ALL">All years</option>' : "") + YEARS.map(x => `<option>${x}</option>`).join("");
      $("pBranch").innerHTML = (c.all ? '<option value="ALL">All branches</option>' : "") + BRANCHES.map(x => `<option>${x}</option>`).join("");
      $("pDivs").innerHTML = (c.all ? '<label><input type="checkbox" value="ALL">All batches</label>' : "")
        + DIVISIONS.map(d => `<label><input type="checkbox" value="${d}">${d}</label>`).join("");
    }
    
    function showLocal() {
      const mine = `${me.year}_${me.branch}_${me.div}`;
      const items = builtIn(current.id).concat(localPosts().filter(p => p.section === current.id && (me.role === "student" ? p.targets.includes(mine) : p.author === me.name))
        .sort((a,b) => b.createdAt - a.createdAt));
      $("list").innerHTML = (me.role === "student" ? "" : "<p><small>Demo mode: posts are saved on this device only.</small></p>")
        + (items.map(card).join("") || "<p>Nothing here yet.</p>");
    }
    $("backBtn").onclick = () => { if (unsub) unsub(); start(); };
    
    function openReminders() {
  current = { id: "reminders", name: "Reminders" };
  $("secTitle").textContent = "⏰ Reminders";
  $("postForm").classList.add("hide");
  show("sectionView");
  if (unsub) unsub();
  const key = me.role === "student" ? `${me.year}_${me.branch}_${me.div}` : "";
  const render = items => {
    const today = new Date().setHours(0,0,0,0);
    const up = items.filter(p => p.date && new Date(p.date + "T00:00:00") >= today)
      .sort((a, b) => a.date.localeCompare(b.date));
    $("list").innerHTML = up.map(p => {
      const sec = (SECTIONS.find(s => s.id === p.section) || {}).name || "";
      return `<p style="color:#fff;margin:12px 0 2px"><b>${esc(sec)}</b></p>` + card(p);
    }).join("") || "<p>No upcoming deadlines.</p>";
  };
  if (!db) return render(localPosts().filter(p => me.role === "student" ? p.targets.includes(key) : p.author === me.name));
  const q = me.role === "student"
    ? query(collection(db,"posts"), where("targets","array-contains",key))
    : query(collection(db,"posts"), where("authorUid","==",me.uid));
  unsub = onSnapshot(q, snap => render(snap.docs.map(d => ({ ...d.data(), id: d.id }))), e => err(e.message));
}
    // ---- clock-style date wheel ----

    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const yr = new Date().getFullYear();
    const cols = { D: $("wD"), M: $("wM"), Y: $("wY") };
    cols.D.innerHTML = Array.from({length:31}, (_,i) => `<div>${i+1}</div>`).join("");
    cols.M.innerHTML = MONTHS.map(m => `<div>${m}</div>`).join("");
    cols.Y.innerHTML = [0,1,2,3].map(i => `<div>${yr+i}</div>`).join("");
    const idx = c => Math.round(c.scrollTop / 50);
    function readWheel() {
      let d = idx(cols.D) + 1; const m = idx(cols.M), y = yr + idx(cols.Y);
      const max = new Date(y, m + 1, 0).getDate();
      if (d > max) { d = max; cols.D.scrollTo({ top: (d-1)*50, behavior: "smooth" }); }
      Object.values(cols).forEach(c => [...c.children].forEach((el, i) => el.classList.toggle("sel", i === idx(c))));
      $("pDate").value = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    }
    let wt;
    Object.values(cols).forEach(c => c.addEventListener("scroll", () => { clearTimeout(wt); wt = setTimeout(readWheel, 80); }));
    function setDateOn(on) {
      $("dateOn").checked = on; $("wheel").classList.toggle("hide", !on);
      if (on) { const n = new Date(); cols.D.scrollTop = (n.getDate()-1)*50; cols.M.scrollTop = n.getMonth()*50; cols.Y.scrollTop = 0; readWheel(); }
      else $("pDate").value = "";
    }
    $("dateOn").onchange = () => setDateOn($("dateOn").checked);
    
    let photoData = null;
    async function toDataUrl(file, max, q) {
      let src, w, h;
      try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); w = src.width; h = src.height; }
      catch (e) {
        const url = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = bad; r.readAsDataURL(file); });
        src = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
        w = src.naturalWidth; h = src.naturalHeight;
      }
      const k = Math.min(1, max / Math.max(w, h));
      const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
      let out = c.toDataURL("image/jpeg", q); if (out.length > 800000) out = c.toDataURL("image/jpeg", 0.4); return out;
    }
    const setPhoto = async f => {
      photoData = null; $("photoPrev").classList.add("hide"); upErr("");
      if (!f) return;
      try { const big = current && ["timetable","syllabus"].includes(current.id); photoData = await toDataUrl(f, big ? 1400 : 900, big ? 0.7 : 0.6); $("prevImg").src = photoData; $("photoPrev").classList.remove("hide"); upErr(""); }
      catch (e) { upErr("Could not read that photo. Use the in-app camera, or pick a JPG or PNG from your gallery."); }
    };
    let camStream = null, camFacing = "environment";
    async function openCam() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return $("camInput").click(); // browser without live camera
      try {
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camFacing }, audio: false });
        $("camVideo").srcObject = camStream; $("camView").classList.remove("hide");
      } catch (e) { err("Camera not available. Allow camera permission for this page, or use Upload from gallery."); }
    }
    function closeCam() {
      if (camStream) camStream.getTracks().forEach(t => t.stop());
      camStream = null; $("camVideo").srcObject = null; $("camView").classList.add("hide");
    }
    $("camBtn").onclick = openCam;
    $("camCancel").onclick = closeCam;
    $("camFlip").onclick = () => { camFacing = camFacing === "environment" ? "user" : "environment"; closeCam(); openCam(); };
    $("shutter").onclick = () => {
      const v = $("camVideo"); if (!v.videoWidth) return;
      const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      c.toBlob(b => { if (b) setPhoto(new File([b], "photo.jpg", { type: "image/jpeg" })); closeCam(); }, "image/jpeg", 0.9);
    };
    $("doneMore").onclick = () => openSection(current.id);
    $("doneHome").onclick = () => { if (unsub) unsub(); start(); };
    $("camInput").onchange = async e => { await setPhoto(e.target.files[0]); e.target.value = ""; };
    $("galInput").onchange = async e => { await setPhoto(e.target.files[0]); e.target.value = ""; };
    $("rmPhoto").onclick = () => setPhoto(null);
    
    let pdfData = null, pdfFile = "";
    const PDF_MAX = 700 * 1024;   // a PDF is stored inside the post, so it has to stay small
    function setPdf(f) {
      pdfData = null; pdfFile = ""; $("pdfPrev").classList.add("hide"); upErr("");
      if (!f) return Promise.resolve();
      if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) { upErr("That is not a PDF file."); return Promise.resolve(); }
      if (f.size > PDF_MAX) { upErr(`That PDF is ${(f.size / 1048576).toFixed(1)} MB. The limit is 0.7 MB. Compress it first (for example on ilovepdf.com), or share a link instead.`); return Promise.resolve(); }
      return new Promise(done => {
        const r = new FileReader();
        r.onload = () => { pdfData = String(r.result).replace(/^data:[^;]*;/, "data:application/pdf;"); pdfFile = f.name; $("pdfName").textContent = `📄 ${f.name} (${Math.round(f.size / 1024)} KB)`; $("pdfPrev").classList.remove("hide"); done(); };
        r.onerror = () => { upErr("Could not read that PDF. Try choosing it again."); done(); };
        r.readAsDataURL(f);
      });
    }
    $("pdfInput").onchange = async e => { await setPdf(e.target.files[0]); e.target.value = ""; };
    $("rmPdf").onclick = () => setPdf(null);
    
    $("postBtn").onclick = async () => {
      let divs = [...document.querySelectorAll("#pDivs input:checked")].map(c => c.value);
      const file = photoData, pdf = pdfData;
      const isContact = !!FORM[current.id].contact, phone = $("pPhone").value.trim();
      if (isContact) {
        if (!/^\+?[0-9][0-9\s\-]{6,14}$/.test(phone)) return err("Enter a valid phone number, for example 98XXXXXXXX.");
        if (!$("pMsg").value.trim()) return err("Add the details: name and when to call.");
      }
      // nothing is compulsory, but a post needs something in it and someone to receive it
      if (!$("pTitle").value.trim() && !$("pMsg").value.trim() && !$("pLink").value.trim() && !$("pDate").value && !file && !pdf)
        return err("Fill in whatever you need: a title, details, link, photo, PDF or date.");
      if ((file || "").length + (pdf || "").length > 900000) return err("The photo and PDF together are too big for one post. Post them separately.");
      if (!divs.length) return err("Choose who should see this: pick at least one batch.");
      const y = $("pYear").value, b = $("pBranch").value;
      if (divs.includes("ALL")) divs = DIVISIONS;
      const ys = y === "ALL" ? YEARS : [y], bs = b === "ALL" ? BRANCHES : [b];
      const targets = ys.flatMap(a => bs.flatMap(c => divs.map(d => `${a}_${c}_${d}`)));
      const audience = [y === "ALL" ? "All years" : y, b === "ALL" ? "All branches" : b,
        divs.length === DIVISIONS.length ? "All batches" : "Batch " + divs.join(", ")].join(" · ");
      $("postBtn").disabled = true; $("postBtn").textContent = "Posting…";
      try {
        const post = {
          section: current.id,
          title: $("pTitle").value.trim() || current.name,
          message: $("pMsg").value.trim(),
          link: $("pLink").value.trim() || null,
          date: $("pDate").value || null,
          image: file,
          pdf, pdfName: pdf ? pdfFile : null,
          phone: isContact ? phone : null,
          targets, audience,
          author: me.name, authorUid: me.uid || null, subject: me.subject
        };
        if (!db) { const all = localPosts(); all.push({ ...post, id: "L" + Date.now() + Math.random().toString(36).slice(2, 6), createdAt: Date.now() }); localStorage.setItem("fcritPosts", JSON.stringify(all)); }
        else { await addDoc(collection(db,"posts"), { ...post, createdAt: serverTimestamp() }); }
        $("pTitle").value = $("pMsg").value = $("pLink").value = "";
        setDateOn(false); setPhoto(null); setPdf(null); err("");
        $("doneInfo").textContent = `${current.name} · Visible to ${audience}`;
        show("doneView");
      } catch (e) { err(e.message); } finally { $("postBtn").disabled = false; $("postBtn").textContent = "Post"; }
    };
    
    // ---- card with reminder countdown ----
    function card(p) {
      if (/^assignments\/[\w.\-]+\.pdf$/i.test(p.file || "")) {
        return `<a class="box filecard" href="${esc(fileHref(p.file))}" target="_blank" rel="noopener"><span class="fi">📄</span><span><b>${esc(p.title)}</b><small>${esc(p.author)}</small></span></a>`;
      }
      let rem = "";
      if (p.date) {
        // "T00:00:00" makes this local midnight, so the day count is right in IST
        const days = Math.round((new Date(p.date + "T00:00:00") - new Date().setHours(0,0,0,0)) / 86400000);
        rem = days > 1 ? `<span class="tag ${days<=3?"soon":""}">in ${days} days</span>`
            : days === 1 ? `<span class="tag soon">Tomorrow</span>`
            : days === 0 ? `<span class="tag soon">Today</span>`
            : `<span class="tag">Done</span>`;
        rem += `<span class="tag">${esc(p.date)}</span>`;
      }
      const img = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(p.image || "") ? `<img src="${p.image}" alt="" style="max-width:100%;border-radius:8px">` : "";
      const link = p.link && /^(https?:\/\/|assignments\/[\w.\-]+\.pdf$)/i.test(p.link) ? `<p><a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.linkText || "Open link")}</a></p>` : "";
      const pdfOk = /^data:application\/pdf;base64,[A-Za-z0-9+\/=]+$/.test(p.pdf || "");
      if (pdfOk) PDFS["p" + (p.id || p.createdAt)] = p.pdf;
      const pdfBtn = pdfOk ? `<p><a class="pdfbtn" href="#" data-pdf="p${esc(p.id || p.createdAt)}">📄 ${esc(p.pdfName || "Open PDF")}</a></p>` : "";
      const phoneOk = /^\+?[0-9][0-9\s\-]{6,14}$/.test(p.phone || "");
      const head = phoneOk ? `<a class="callbtn" href="tel:${esc(String(p.phone).replace(/[^\d+]/g, ""))}">📞 ${esc(p.phone)}</a>` : `<b>${esc(p.title)}</b>`;
      const tg = me.role !== "teacher" ? "" : p.audience ? `<div><span class="tag">${esc(p.audience)}</span></div>`
        : `<div>${p.targets.map(t => `<span class="tag">${esc(t.replaceAll("_"," "))}</span>`).join("")}</div>`;
      return `<div class="box">${head}<div>${rem}</div><p>${esc(p.message)}</p>${img}${link}${pdfBtn} <small>${esc(p.author)} · ${esc(p.subject)}</small>${tg}${me.role === "teacher" && p.author === me.name ? `<div><button class="del" data-id="${esc(p.id || p.createdAt)}">Delete this post</button></div>` : ""}</div>`;
    }
    
    $("list").addEventListener("click", e => {
      const a = e.target.closest("[data-pdf]"); if (!a) return;
      e.preventDefault();
      const d = PDFS[a.dataset.pdf]; if (!d) return;
      const bytes = Uint8Array.from(atob(d.split(",")[1]), c => c.charCodeAt(0));
      window.open(URL.createObjectURL(new Blob([bytes], { type: "application/pdf" })), "_blank");
    });
    $("list").addEventListener("click", async e => {
      const b = e.target.closest(".del"); if (!b) return;
      if (!confirm("Delete this post? Students will no longer see it.")) return;   // Cancel keeps the post
      try {
        if (!db) { localStorage.setItem("fcritPosts", JSON.stringify(localPosts().filter(p => String(p.id || p.createdAt) !== b.dataset.id))); showLocal(); }
        else await deleteDoc(doc(db, "posts", b.dataset.id));   // the list updates by itself
      } catch (er) { err(er.message); }
    });
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
    await initFirebase();
    start();
    </script></body></html>
